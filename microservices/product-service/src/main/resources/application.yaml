spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:productdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  cloud:
    function:
      definition: processOrderCreatedEvent
    stream:
      bindings:
        testEvent-out-0:
          destination: test-topic # hangi başlığa bu eventi göndereyim?
          content-type: application/json # hangi tür ile göndereyim?
        processOrderCreatedEvent-in-0:
          destination: order-created-topic
          group: product-service-group
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

server:
  port: 8084
