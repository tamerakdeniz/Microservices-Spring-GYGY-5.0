spring:
  application:
    name: product-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/microservices-spring}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  cloud:
    function:
      definition: processOrderCreatedEvent
    stream:
      bindings:
        testEvent-out-0:
          destination: test-topic # hangi başlığa bu eventi göndereyim?
          content-type: application/json # hangi tür ile göndereyim?
        processOrderCreatedEvent-in-0:
          destination: order-created-topic
          group: product-service-group
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

server:
  port: 8084
